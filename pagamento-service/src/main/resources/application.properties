spring.application.name=payment
server.port=8083

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5434/pagamentodb
spring.datasource.username=${DB_USER:pagamentodb}
spring.datasource.password=${DB_PASS:pagamentodb}
spring.jpa.hibernate.ddl-auto=none

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=pagamento-group

# External Payment Service
procpag.url=http://${PROCPAG_HOST:localhost}:8089

# Kafka Topics
kafka.topic.pagamento-aprovado=pagamento-aprovado
kafka.topic.pagamento-pendente=pagamento-pendente
kafka.topic.pedido-criado=pedido-criado
kafka.topic.pedido-criado-dlq=pedido-criado-dlq

# Kafka publish timeout
kafka.publish.timeout=30

# Security (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${AUTH_HOST:localhost}:8081

# Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakers/events
management.endpoint.health.show-details=always

# Resilience4j Retry
resilience4j.retry.instances.procPagRetry.max-attempts=3
resilience4j.retry.instances.procPagRetry.wait-duration=5s
resilience4j.retry.instances.procPagRetry.retry-exceptions[0]=java.lang.Exception
