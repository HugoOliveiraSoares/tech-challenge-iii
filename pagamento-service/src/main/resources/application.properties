spring.application.name=payment
server.port=8083

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://postgres:5432/pagamentodb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none

# Flyway Migrations
spring.flyway.url=jdbc:postgresql://postgres:5432/pagamentodb
spring.flyway.baseline-on-migrate=true

# Kafka Producer
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=pagamento-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# External Payment Service
procpag.url=http://procpag:8089

# Security (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://auth-service:8081

# Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakers/events
management.endpoint.health.show-details=always

