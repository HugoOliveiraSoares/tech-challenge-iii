# Configuração do pedido-service (porta 8082)
spring.application.name=pedido-service
server.port=8082

# Base URI do campo "type" em respostas de erro (RFC 7807 Problem Details)
api.problems.base-uri=${API_PROBLEMS_BASE_URI:http://localhost:8082/problems}

# Banco dedicado ao serviço (Docker: pedido-db:5432, local: localhost:5433)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/pedidodb
spring.datasource.username=${DB_USER:pedidodb}
spring.datasource.password=${DB_PASSWORD:pedidodb}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Migrações SQL versionadas na subida da aplicação
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Valida token JWT usando chave pública do auth-service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

# Kafka: 9094 no host, kafka:9092 dentro do Docker Compose
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=pedido-group

# Tópicos do fluxo assíncrono com pagamento-service
kafka.topic.pedido-criado=pedido-criado
kafka.topic.pagamento-aprovado=pagamento-aprovado
kafka.topic.pagamento-pendente=pagamento-pendente
kafka.publish.timeout=30
