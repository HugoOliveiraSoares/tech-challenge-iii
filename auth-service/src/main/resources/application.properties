spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/authdb
spring.datasource.username=${DB_USER:authdb}
spring.datasource.password=${DB_PASSWORD:authdb}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.issuer=${JWT_ISSUER:http://localhost:8081}
jwt.expiration=86400000