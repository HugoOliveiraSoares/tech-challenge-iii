x-postgres: &postgres-base
  image: postgres:15
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - fase3net

services:
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USER: authdb
      DB_PASSWORD: authdb
      JWT_ISSUER: http://auth-service:8081
    networks:
      - fase3net

  pedido-service:
    build:
      context: .
      dockerfile: pedido-service/Dockerfile
    container_name: pedido-service
    ports:
      - "8082:8082"
    depends_on:
      pedido-db:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    environment:
      DB_HOST: pedido-db
      DB_PORT: 5432
      DB_USER: pedidodb
      DB_PASSWORD: pedidodb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      API_PROBLEMS_BASE_URI: http://localhost:8082/problems
    networks:
      - fase3net

  pagamento-service:
    build:
      context: .
      dockerfile: pagamento-service/Dockerfile
    container_name: pagamento-service
    ports:
      - "8083:8083"
    depends_on:
      pagamento-db:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
      procpag:
        condition: service_started
    environment:
      DB_HOST: pagamento-db
      DB_PORT: 5432
      DB_USER: pagamentodb
      DB_PASS: pagamentodb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROCPAG_HOST: procpag
    networks:
      - fase3net

  procpag:
    image: docker.io/erickemprobr/procpag:latest
    platform: linux/amd64
    ports:
      - "8089:8089"
    networks:
      - fase3net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 3IpOp3mGRC6ee/HihtLadg
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fase3net

  kafka-setup:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic pedido-criado --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic pagamento-aprovado --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic pagamento-pendente --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic pedido-criado-dlq --partitions 1 --replication-factor 1
    networks:
      - fase3net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fase3net

  auth-db:
    <<: *postgres-base
    container_name: auth-db
    environment:
      POSTGRES_USER: authdb
      POSTGRES_PASSWORD: authdb
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data

  pedido-db:
    <<: *postgres-base
    container_name: pedido-db
    environment:
      POSTGRES_USER: pedidodb
      POSTGRES_PASSWORD: pedidodb
      POSTGRES_DB: pedidodb
    ports:
      - "5433:5432"
    volumes:
      - pedido_data:/var/lib/postgresql/data

  pagamento-db:
    <<: *postgres-base
    container_name: pagamento-db
    environment:
      POSTGRES_USER: pagamentodb
      POSTGRES_PASSWORD: pagamentodb
      POSTGRES_DB: pagamentodb
    ports:
      - "5434:5432"
    volumes:
      - pagamento_data:/var/lib/postgresql/data

volumes:
  auth_data:
  pedido_data:
  pagamento_data:
  kafka_data:

networks:
  fase3net:
